<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#01020a"/>

  <!-- Outer orbit ring -->
  <circle cx="16" cy="16" r="13" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>

  <!-- Inner orbit ring -->
  <circle cx="16" cy="16" r="8" stroke="#00d4ff" stroke-width="0.8" opacity="0.7"/>

  <!-- Tilted ellipse orbit -->
  <ellipse cx="16" cy="16" rx="13" ry="5"
    stroke="#00d4ff" stroke-width="0.7" opacity="0.4"
    transform="rotate(-30 16 16)"/>

  <!-- Center orb -->
  <circle cx="16" cy="16" r="3" fill="#00d4ff"/>
  <circle cx="16" cy="16" r="1.5" fill="white"/>

  <!-- Orbiting dot -->
  <circle cx="27" cy="13" r="1.5" fill="#00d4ff" opacity="0.9"/>
</svg>
